[package]
name = "steam-tool-plus"
version = "1.41.0"
description = "Steam Tool Plus - 本地游戏管理系统"
authors = ["Steam Tool Plus"]
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Steam 消息 protobuf 代码生成（编译期从 .proto 生成 Rust 结构体）
prost-build = "0.13"
# 自动提供 protoc 编译器二进制（无需系统安装 protobuf-compiler）
protoc-bin-vendored = "3"

[dependencies]
# Tauri核心依赖
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-single-instance = "2.4.2"

# 序列化/反序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# 异步运行时（仅启用必要特性）
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "macros"] }

# 单例管理
once_cell = "1.21.4"

# 7z压缩/解压（最新纯 Rust 实现）
zesven = "2.0"

# 日志
log = "0.4.33"
env_logger = "0.11.10"

# UUID生成
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# 时间处理
chrono = { version = "0.4.45", features = ["serde"] }

# Base64编码（游戏封面图片处理、manifest 加密文件名解码）
base64 = "0.22.1"

# 十六进制编解码（depot 解密密钥解析：config.vdf / lua 中的 64 位 hex 字符串）
hex = "0.4.3"

# HTTP客户端（Steam封面图下载）
# http2：CDN 走 HTTP/2 多路复用——单连接复用、建连开销大减，多块并发下载吞吐更高
reqwest = { version = "0.13.4", features = ["json", "stream", "http2"] }

# Stream 扩展（下载进度）
futures-util = "0.3"

# 正则表达式（Lua/VDF转换、清单文件解析）
regex = "1.12.4"

# Windows注册表操作（Steam路径检测、高级入库功能）
winreg = "0.55.0"

# 错误处理
thiserror = "2.0"

# 进程管理（实例冲突检测）
sysinfo = "0.35"

# ===== Steam 下载引擎（Rust 重写，替换 ddv20.exe）=====
# protobuf 序列化（Steam 消息编解码）
prost = "0.13"
prost-derive = "0.13"
# 会话加密：RSA 公钥加密（登录握手交换会话密钥）
# 0.9.10 起 pkcs8 为强制依赖（非可选特性），公钥解析用 rsa::pkcs8::DecodePublicKey；
# OAEP 填充的摘要经 Oaep::new::<Sha1>() 泛型注入（sha1 0.10 实现 Digest + DynDigest），无需专用特性
rsa = "0.9"
# 加密握手报文 CRC-32 校验（与 SteamKit Crc32.Hash 一致，标准 CRC-32/ISO-HDLC）
crc32fast = "1"
# 密码学安全随机数（会话密钥 / IV 随机部分生成）
# 注意：rsa 0.9 仍依赖 rand_core 0.6（其 RngCore 特质版本），而 rand 0.9 内部为 rand_core 0.9，
# 两者特质不通用。直接依赖 rand_core 0.6 并启用 getrandom 特性（提供 OsRng）以与 rsa 握手加密匹配。
rand_core = { version = "0.6", features = ["std", "getrandom"] }
# AES 会话加密（登录后消息体加解密）
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# 会话密钥派生与消息完整性校验
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
# 内容校验：文件 SHA-1（chunk ID 即 SHA-1 摘要）
sha1 = "0.10"
# 分块校验：ADLER-32（与 SteamKit Util.AdlerHash 一致）
adler2 = "2"
# WebSocket 连接 CM 服务器（当前 Steam 推荐通道）
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# gzip 解压（CM 会把多条登录应答打成 gzip 压缩的 CMsgMulti，须解压后再拆帧，
# 对标 SteamKit CMClient.HandleMulti：size_unzipped>0 时走 GZipStream）
flate2 = "1"
# 取消令牌 CancellationToken（Phase 5：前端 stop_download → 引擎各边界点退出）
tokio-util = { version = "0.7", features = ["rt"] }

# ===== Steam 分块/清单解压（cdn.rs 使用，均纯 Rust 实现，无 C 依赖）=====
# ZIP：CDN 返回的 manifest 是 zip 包、极少数旧分块为 PKZip 格式
zip = "8"
# VZip（LZMA1）分块解压：Steam 私有 LZMA 变体，5 字节属性 + 原始 LZMA 流
# raw_decoder 特性暴露 LzmaParams::new（自定义 lc/lp/pb 属性，适配 VZip 私有头）
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
# VZstd（zstd）分块解压：标准 zstd 帧（仅解压，无需压缩端）
ruzstd = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Windows 平台专属依赖：封装 WebView2 内存管理（TrySuspend/Resume、MemoryUsageTargetLevel）
# Win32_* 特性为 machine_id.rs 提供硬件指纹读取
# （GetVolumeNameForVolumeMountPointW / QueryDosDeviceW / DeviceIoControl / GetAdaptersInfo）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Graphics_Gdi",
    # Win32_UI_Shell 为 open_external_link 的默认浏览器检测提供 AssocQueryStringW
    "Win32_UI_Shell",
] }

# 发布优化配置 - 极致体积优化
[profile.release]
opt-level = "z"          # 优化体积（比 "s" 更激进）
lto = true               # 启用完整链接时优化
codegen-units = 1        # 单代码生成单元，最大化优化
strip = true             # 剥离符号表
panic = "abort"          #  panic 时直接中止，减少代码量

